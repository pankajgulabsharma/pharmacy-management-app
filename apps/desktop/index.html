<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare Pharmacy</title>
    <script>
      // Same theme as the app from the very first frame (no light/dark flash)
      try {
        var t = localStorage.getItem("theme") || "light";
        if (
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <style>
      /* App loader — one look for the very first start (below, before any
         script) and every later wait (components/common/AppLoader.tsx) */
      .mc-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font-family: Inter, system-ui, sans-serif;
      }
      .mc-orb {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }
      .mc-orb::before,
      .mc-orb::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );
      }
      .mc-orb::before {
        inset: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0 15%,
          #6366f1 45%,
          #a855f7 75%,
          transparent 100%
        );
        animation: mc-spin 1.1s linear infinite;
      }
      .mc-orb::after {
        inset: 11px;
        background: conic-gradient(
          from 180deg,
          transparent 0 30%,
          #22d3ee 70%,
          transparent 100%
        );
        opacity: 0.7;
        animation: mc-spin 1.7s linear infinite reverse;
      }
      .mc-logo {
        width: 50px;
        height: 50px;
        display: block;
        filter: drop-shadow(0 8px 16px rgba(91, 33, 182, 0.45));
        animation: mc-breathe 1.8s ease-in-out infinite;
      }
      .mc-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #0f172a;
        margin: 0;
      }
      .mc-sub {
        font-size: 12px;
        color: #64748b;
        margin: -12px 0 0;
      }
      .mc-bar {
        position: relative;
        width: 168px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(99, 102, 241, 0.14);
      }
      .mc-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          transparent,
          #6366f1,
          #a855f7,
          transparent
        );
        animation: mc-slide 1.3s ease-in-out infinite;
      }
      /* Edge to edge, same colour as the app — no white frame round the
         loader (the browser's default 8px body margin) */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #f8fafc;
      }
      html.dark,
      html.dark body,
      html.dark #root {
        background: #020617;
      }
      .mc-boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }
      .dark .mc-boot {
        background: #020617;
      }
      .dark .mc-title {
        color: #f1f5f9;
      }
      .dark .mc-sub {
        color: #94a3b8;
      }
      @keyframes mc-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes mc-breathe {
        50% {
          transform: scale(1.07);
        }
      }
      @keyframes mc-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mc-orb::before,
        .mc-orb::after,
        .mc-logo,
        .mc-bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mc-boot">
        <div class="mc-loader" role="status" aria-label="Loading">
          <div class="mc-orb">
            <!-- Same mark as the app icon (public/favicon.svg) -->
            <img class="mc-logo" src="/favicon.svg" alt="" />
          </div>
          <p class="mc-title">MediCare Pharmacy</p>
          <p class="mc-sub">Starting…</p>
          <div class="mc-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
