<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare Pharmacy</title>
    <script>
      // Same theme as the app from the very first frame (no light/dark flash)
      try {
        var t = localStorage.getItem("theme") || "light";
        if (
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      /* App loader — one look for the very first start (below, before any
         script) and every later wait (components/common/AppLoader.tsx) */
      .mc-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font-family: Inter, system-ui, sans-serif;
      }
      .mc-orb {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }
      .mc-orb::before,
      .mc-orb::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3px)
        );
      }
      .mc-orb::before {
        inset: 0;
        background: conic-gradient(
          from 0deg,
          transparent 0 15%,
          #6366f1 45%,
          #a855f7 75%,
          transparent 100%
        );
        animation: mc-spin 1.1s linear infinite;
      }
      .mc-orb::after {
        inset: 11px;
        background: conic-gradient(
          from 180deg,
          transparent 0 30%,
          #22d3ee 70%,
          transparent 100%
        );
        opacity: 0.7;
        animation: mc-spin 1.7s linear infinite reverse;
      }
      .mc-logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        box-shadow: 0 8px 28px -6px rgba(99, 102, 241, 0.65);
        animation: mc-breathe 1.8s ease-in-out infinite;
      }
      .mc-logo svg {
        width: 26px;
        height: 26px;
      }
      .mc-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #0f172a;
        margin: 0;
      }
      .mc-sub {
        font-size: 12px;
        color: #64748b;
        margin: -12px 0 0;
      }
      .mc-bar {
        position: relative;
        width: 168px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(99, 102, 241, 0.14);
      }
      .mc-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          transparent,
          #6366f1,
          #a855f7,
          transparent
        );
        animation: mc-slide 1.3s ease-in-out infinite;
      }
      .mc-boot {
        height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }
      .dark .mc-title {
        color: #f1f5f9;
      }
      .dark .mc-sub {
        color: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        .mc-boot {
          background: #0b1120;
        }
        .mc-boot .mc-title {
          color: #f1f5f9;
        }
      }
      @keyframes mc-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes mc-breathe {
        50% {
          transform: scale(1.07);
          box-shadow: 0 10px 36px -4px rgba(124, 58, 237, 0.7);
        }
      }
      @keyframes mc-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mc-orb::before,
        .mc-orb::after,
        .mc-logo,
        .mc-bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mc-boot">
        <div class="mc-loader" role="status" aria-label="Loading">
          <div class="mc-orb">
            <div class="mc-logo">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="2.6"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
            </div>
          </div>
          <p class="mc-title">MediCare Pharmacy</p>
          <p class="mc-sub">Starting…</p>
          <div class="mc-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
