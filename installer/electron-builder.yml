# Windows installer for MediCare Pharmacy (build on Windows, or with GitHub
# Actions — see .github/workflows/installer.yml)
appId: in.medicare.pharmacy
productName: MediCare Pharmacy
copyright: MediCare
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: res
    to: .
    filter: ["**/*"]
asar: true
# Lock the app down: it can't be started as plain Node, or with debugging /
# NODE_OPTIONS tricks to inject code (e.g. to skip the licence check)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
# Only the languages the app speaks (smaller download)
electronLanguages: [en-US, hi]
# Automatic updates (GitHub Releases, free) are switched on by the
# release workflow (.github/workflows/installer.yml) — it adds the
# "publish" settings. Builds made without it simply don't auto-update.
win:
  icon: build/icon.ico
  target: nsis
  artifactName: MediCare-Pharmacy-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MediCare Pharmacy
  # Uninstalling never deletes the shop's data (kept in AppData\Roaming)
  deleteAppDataOnUninstall: false
